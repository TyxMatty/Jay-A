# A release on a version tag (v*): builds the Windows installer (NSIS) on a clean machine, signs
# it for the auto-update (frontend/src-tauri/src/updater.rs) and creates a DRAFT release with the
# installer, its .sig and latest.json. Publishing the draft (by hand, after checking the installer)
# is what makes the installed Jay-As update: they read releases/latest/download/latest.json.
#
# Secrets (Settings > Secrets and variables > Actions): TAURI_SIGNING_PRIVATE_KEY (the contents of
# the private key made by `npx tauri signer generate`) and, only if the key has a password,
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD (a missing secret reads as empty). The public key is in
# tauri.conf.json.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer (NSIS) and update
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}\target
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # crates/jay-audio's build.rs compiles WebRTC's audio processing with Meson + Ninja.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install meson ninja
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> ../../target
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: frontend
          tagName: ${{ github.ref_name }}
          releaseName: Jay-A __VERSION__
          releaseDraft: true
          includeUpdaterJson: true
