# The Windows installer (NSIS), built on a clean machine: on a version tag (v*) or by hand from the
# Actions tab. It is kept as the run's artifact; publishing the release stays a manual step, as in
# Jay-C and Jay-H. Jay-H (the line's hub) installs and updates Jay-A from that release: it reads the
# latest release, downloads the `*_x64-setup.exe` asset and checks its SHA-256; so does the app's own
# updater (frontend/src-tauri/src/update.rs).
# The artifact is the Jay-I setup carrying the NSIS installer, never the raw NSIS file. The Jay-I
# pin (ref of the second checkout) must be bumped together with `jay-i` in frontend/src-tauri/Cargo.toml.
name: Installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer (NSIS)
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}\target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Jay-H compares the tag with the installed version: a tag that isn't the app's version
      # would offer an update forever.
      - name: The tag is the app's version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content frontend/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME, tauri.conf.json $version" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # crates/jay-audio's build.rs compiles WebRTC's audio processing with Meson + Ninja.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install meson ninja
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the "stable" branch
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            frontend/src-tauri -> ../../target
            jay-i
      - run: npm ci
      # tauri build: vite build, cargo build --release, then the NSIS installer.
      - run: npm run build
      # The release asset is the Jay-I setup (a small window that carries the NSIS installer above),
      # pinned to the same commit as the jay-i dependency in frontend/src-tauri/Cargo.toml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TyxMatty/Jay-I
          ref: 60de872dee82c5be37d2ea15c5f94d0dddffde26
          path: jay-i
          persist-credentials: false
      - name: Build the Jay-I setup around the NSIS installer
        shell: pwsh
        run: |
          $version = (Get-Content frontend/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $name = "Jay-A_${version}_x64-setup.exe"
          $nsis = Join-Path $PWD 'target/release/bundle/nsis'
          $raw = @(Get-ChildItem -LiteralPath $nsis -Filter $name -File)
          if ($raw.Count -ne 1) { throw "expected exactly one $name in $nsis, found $($raw.Count)" }
          $out = Join-Path $PWD 'setup-out'
          & (Join-Path $PWD 'jay-i/scripts/build-setup.ps1') `
            -Payload $raw[0].FullName -Name Jay-A -Version $version -Exe jay-a.exe `
            -Icon (Join-Path $PWD 'frontend/src-tauri/icons/icon.ico') `
            -Mark (Join-Path $PWD 'frontend/src-tauri/icons/128x128@2x.png') `
            -OutDir $out
          if ($LASTEXITCODE -ne 0) { throw "build-setup.ps1 failed ($LASTEXITCODE)" }
          $setup = @(Get-ChildItem -LiteralPath $out -File)
          if ($setup.Count -ne 1 -or $setup[0].Name -ne $name) { throw "setup-out must hold only $name" }
          # RNF-12 (docs/ARQUITETURA.md): the installer stays up to 20 MB; the same size as the raw
          # installer means it was copied by mistake.
          if ($setup[0].Length -gt 20 * 1024 * 1024) { throw "$name is $($setup[0].Length) bytes, over 20 MB" }
          if ($setup[0].Length -eq $raw[0].Length) { throw "$name is the raw NSIS installer, not the setup" }
          Write-Host "$name ($($setup[0].Length) bytes)"
      # Only the setup is uploaded: the hub takes any release asset ending in _x64-setup.exe.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Jay-A-installer-${{ github.ref_name }}
          path: setup-out/*_x64-setup.exe
          if-no-files-found: error
