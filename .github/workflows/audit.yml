# Audits: known vulnerabilities in the dependencies (npm and both Cargo lock files) and secrets in
# the git history, on every push to main, every pull request and every Monday. Copied from Jay-S
# and Jay-I. The tests run on the developer's PC (npm test, cargo test); the installer has its own
# workflow (installer.yml).
name: Audits

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # An advisory can come out for a dependency nobody touched: the audits also run every Monday.
  schedule:
    - cron: '41 6 * * 1'

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Audits (dependencies, secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks reads the whole history
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Reads package-lock.json: nothing is installed, so no package's code runs here.
      - name: npm audit (high and critical)
        run: npm audit --audit-level=high
      # shortcut: built from source on each run (~3 min, with the runner's own Rust); upgrade to a
      # cached binary if the wait starts to matter.
      - name: cargo audit (both lock files)
        run: |
          cargo install cargo-audit --locked
          cargo audit --file crates/jay-audio/Cargo.lock
          cargo audit --file frontend/src-tauri/Cargo.lock
      # The release's own binary, by its SHA-256 (from its checksums file), not an Action.
      - name: Secrets in the git history (gitleaks)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner .
