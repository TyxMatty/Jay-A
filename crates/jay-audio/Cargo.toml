[package]
name = "jay-audio"
version = "0.1.0"
description = "Jay-A's audio engine: microphone, WebRTC audio processing, effect chain, monitor"
authors = ["TyxMatty"]
license = "MIT"
edition = "2024"
rust-version = "1.90"
links = "jay-audio"

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Noise suppression by neural network (the denoise effect). RNNoise in Rust (BSD).
nnnoiseless = { version = "0.5.2", default-features = false }
# DeepFilterNet 3 (MIT/Apache, model included), from the official repository: crates.io only
# has an old 0.2. Tract runs the ONNX model in Rust.
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", tag = "v0.5.6", default-features = false, features = ["tract", "default-model"] }
ndarray = "0.15"

# The neural network is far too slow unoptimized; optimize the dependencies even in debug builds
# (the app's Cargo.toml does the same for `npm run dev`).
[profile.dev.package."*"]
opt-level = 3

[target.'cfg(windows)'.dependencies]
wasapi = "0.26"
# The version wasapi already uses: the Jay Link's pipe and the echo reference's process list.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[build-dependencies]
cc = "1"
