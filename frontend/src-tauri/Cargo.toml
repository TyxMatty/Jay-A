[package]
name = "jay-a"
version = "0.1.3"
description = "Jay-A — audio filters, editing, soundboard and conversion"
authors = ["TyxMatty"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde_json = "1"
jay-audio = { path = "../../crates/jay-audio" }

[profile.release]
# Smaller, leaner binaries (same as Jay-C).
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# The dependencies (jay-audio, and the neural network of its noise removal) run audio in real
# time: optimized for speed, also in `npm run dev`, where unoptimized they can't keep up.
[profile.release.package."*"]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
